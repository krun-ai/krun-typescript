name: OpenAPI drift

# Compares https://api.krun.ai/openapi.json with openapi/openapi.json. Kept out of the regular CI so that unit
# tests never depend on the network.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-openapi.mjs
