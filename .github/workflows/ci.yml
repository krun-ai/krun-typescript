name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (unit, contract, mock-server integration; no network)
        run: npm test
      - name: Build
        run: npm run build
      - name: Package contents
        run: npm pack --dry-run
      - name: Import the built package
        run: node -e "import('@krun-ai/sdk').then((m) => console.log('ok', m.VERSION))"
